  docker_build_and_push:
    runs-on: ubuntu-latest
    needs: [build_and_test]
    # needs: [build_and_test, sast_analysis]
    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write 

    env:
      ecr_repo: aws-bootcamp-test-01
      aws_region: us-east-1
      tag: latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t ${{ env.ecr_repo }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808826729764:role/GitHubActions-BackendECRRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push Image to ECR
        id: docker-tag-push  
        env:
          ecr_registry: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ${{ env.ecr_repo }}:${{ env.tag }} ${{ env.ecr_registry }}/${{ env.ecr_repo }}:${{ env.tag }}
          docker push ${{ env.ecr_registry }}/${{ env.ecr_repo }}:${{ env.tag }}

      - name: Docker Scout CVEs
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.ecr_repo }}:${{ env.tag }}
          only-severities: high,critical
          exit-code: true
  
  call_cd_workflow:
    needs: docker_build_and_push
    if: github.ref == 'refs/heads/main'
    uses: Mauricio-Camilo-AWS-Projects/CI-CD-Workflows/.github/workflows/cd.yml@main
    with:
      image_tag: 'latest'
    secrets: inherit

